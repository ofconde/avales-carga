<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Informe Mensual — CFI Carga</title>
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background: none !important; padding: 0 !important; }
      .page { box-shadow: none !important; margin: 0 !important; }
      /* No cortar un encabezado de sección de su contenido */
      .sh { break-after: avoid; page-break-after: avoid; }
      /* No partir bloques cohesivos por la mitad */
      .stats-bar, .usd-note, .anual-chart, .lines-layout,
      .obs-grid, .region-grid { break-inside: avoid; page-break-inside: avoid; }
      /* No partir celdas/filas individuales entre páginas */
      .ava-cell, .prov-row, .region-cell, .obs-cell, .leg-row {
        break-inside: avoid; page-break-inside: avoid;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #F4F1EA;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; padding: 28px 16px;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .toolbar {
      width: 740px; max-width: 100%;
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 14px;
    }
    .btn-back { font-size: 12px; color: #888; text-decoration: none; }
    .btn-back:hover { color: #444; }
    .btn-print {
      background: #15140F; color: #fff; border: none; border-radius: 4px;
      padding: 7px 16px; font-size: 11px; font-weight: 600; cursor: pointer;
      letter-spacing: 0.06em;
    }
    .btn-print:hover { background: #2e2d22; }
    .toolbar-right { display: flex; align-items: center; gap: 10px; }
    .sel-mes-label {
      font-size: 10px; font-weight: 600; letter-spacing: 0.06em;
      text-transform: uppercase; color: #aaa;
    }
    .sel-mes {
      background: #fff; color: #15140F; border: 1px solid #d8d2c4;
      border-radius: 4px; padding: 6px 10px; font-size: 11px; font-weight: 600;
      font-family: inherit; cursor: pointer;
    }
    .sel-mes:focus { outline: none; border-color: #15140F; }
    .page {
      background: #fff; width: 740px; max-width: 100%;
      padding: 40px 44px; box-shadow: 0 3px 24px rgba(0,0,0,0.14);
    }

    /* Header */
    .rpt-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 22px; }
    .rpt-kicker { font-size: 8.5px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #aaa; display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
    .rpt-dot { width: 6px; height: 6px; border-radius: 50%; background: #c0392b; flex-shrink: 0; }
    .rpt-title { font-size: 24px; font-weight: 700; letter-spacing: -0.03em; color: #15140F; }
    .rpt-right { text-align: right; }
    .rpt-tagline { font-size: 10px; font-weight: 600; color: #888; letter-spacing: 0.04em; margin-bottom: 2px; }
    .rpt-period { font-size: 16px; font-weight: 700; color: #15140F; }
    .rpt-meta { font-size: 9px; color: #bbb; line-height: 1.7; margin-top: 4px; }

    /* Stats bar */
    .stats-bar { background: #15140F; padding: 17px 22px; display: grid; grid-template-columns: repeat(4, 1fr); margin-bottom: 8px; }
    .sc { padding: 0 18px; border-right: 1px solid rgba(255,255,255,0.07); }
    .sc:first-child { padding-left: 0; }
    .sc:last-child { border-right: none; }
    .sc-lbl { font-size: 7.5px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.32); margin-bottom: 7px; }
    .sc-val { font-size: 26px; font-weight: 700; letter-spacing: -0.04em; color: #D4A830; line-height: 1; margin-bottom: 5px; }
    .sc-val.wh { color: #fff; }
    .sc-sub { font-size: 8px; color: rgba(255,255,255,0.22); }

    /* USD note */
    .usd-note { background: #f0faf0; border-left: 3px solid #4caf50; padding: 8px 12px; font-size: 9px; color: #2e7d32; margin-bottom: 28px; display: flex; align-items: center; gap: 8px; }
    .usd-note-val { font-weight: 700; font-size: 11px; }

    /* Section header */
    .sh { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1.5px solid #15140F; padding-bottom: 5px; margin-bottom: 14px; }
    .sh-t { font-size: 10px; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase; color: #15140F; }
    .sh-s { font-size: 8.5px; color: #bbb; }

    /* Observaciones operativas */
    .obs-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 28px; }
    .obs-cell { border: 1px solid #e5e0d6; padding: 12px 14px; background: #faf8f3; }
    .obs-lbl { font-size: 7.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #aaa; margin-bottom: 6px; }
    .obs-val { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; color: #15140F; }

    /* Annual evolution chart */
    .anual-chart { margin-bottom: 28px; }

    /* Province grid — 2 cols, full names */
    .prov-grid { display: grid; grid-template-columns: repeat(2, 1fr); column-gap: 28px; row-gap: 7px; margin-bottom: 28px; }
    .prov-row { display: grid; grid-template-columns: 9px 1fr auto 28px 50px; align-items: center; gap: 6px; }
    .prov-dot { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
    .prov-name { font-size: 9.5px; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .prov-bg { height: 3.5px; background: #ede9e1; border-radius: 2px; overflow: hidden; }
    .prov-fill { height: 100%; border-radius: 2px; }
    .prov-n { font-size: 9.5px; font-weight: 600; color: #444; text-align: right; }
    .prov-amt { font-size: 8px; color: #aaa; text-align: right; }

    /* Lines section */
    .lines-layout { display: grid; grid-template-columns: 178px 1fr; gap: 22px; margin-bottom: 28px; align-items: start; }
    .donut-col { display: flex; flex-direction: column; align-items: center; }
    .legend { margin-top: 10px; width: 100%; }
    .leg-row { display: flex; align-items: center; gap: 5px; font-size: 7.5px; color: #666; margin-bottom: 4px; }
    .leg-sq { width: 8px; height: 8px; border-radius: 1px; flex-shrink: 0; }
    .leg-pct { margin-left: auto; color: #bbb; }
    .lines-tbl { width: 100%; border-collapse: collapse; font-size: 9px; }
    .lines-tbl th { font-size: 7.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #bbb; padding: 0 6px 6px 0; text-align: right; border-bottom: 1px solid #eae6dd; }
    .lines-tbl th:first-child { text-align: left; }
    .lines-tbl td { padding: 5px 6px 5px 0; border-top: 1px solid #f2ede4; text-align: right; color: #555; }
    .lines-tbl td:first-child { text-align: left; color: #1a1a14; font-weight: 500; }
    .lines-tbl .usd td { color: #2e7d32; }
    .lines-tbl tfoot td { padding: 6px 6px 0 0; border-top: 1.5px solid #15140F; font-weight: 700; text-align: right; }
    .lines-tbl tfoot td:first-child { text-align: left; }

    /* Avalista grid */
    .ava-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: #e5e0d6; border: 1px solid #e5e0d6; margin-bottom: 28px; }
    .ava-cell { background: #fff; padding: 7px 10px; display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; align-items: center; }
    .ava-name { font-size: 8.5px; font-weight: 700; color: #15140F; }
    .ava-n { font-size: 8.5px; font-weight: 600; color: #333; }
    .ava-m { font-size: 8px; color: #aaa; }
    .ava-p { font-size: 8px; color: #ccc; }

    /* Region grid */
    .region-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 28px; }
    .region-cell { border: 1px solid #e5e0d6; padding: 10px 12px; background: #faf8f3; }
    .reg-name { font-size: 7.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #999; margin-bottom: 6px; }
    .reg-n { font-size: 20px; font-weight: 700; letter-spacing: -0.03em; color: #15140F; margin-bottom: 1px; }
    .reg-amt { font-size: 9px; color: #bbb; }
    .reg-usd { font-size: 9px; color: #2e7d32; margin-top: 2px; }

    /* Footer */
    .rpt-footer { margin-top: 24px; padding-top: 10px; border-top: 1px solid #e5e0d6; display: flex; justify-content: space-between; font-size: 8px; color: #ccc; }
  </style>
</head>
<body>
<div class="toolbar no-print">
  <a href="/carga" class="btn-back">← Volver al tablero</a>
  <div class="toolbar-right">
    <label class="sel-mes-label" for="sel-mes">Mes del informe</label>
    <select class="sel-mes" id="sel-mes"></select>
    <button class="btn-print" onclick="window.print()">↓ Imprimir / Exportar PDF</button>
  </div>
</div>
<div class="page" id="page">
  <p style="text-align:center;padding:40px;color:#aaa">Cargando informe…</p>
</div>

<script>
const DONUT_COLORS = [
  '#1B3A1B','#2E5A2E','#3D7A3D','#5C9A4A','#7AB55A',
  '#A0C870','#C8E090','#D8EAB0','#C9A830','#C0392B'
];
const PROV_COLORS = {
  BA:'#B85450',CO:'#B85450',ER:'#B85450',SF:'#B85450',
  CA:'#8B7355',JU:'#8B7355',SA:'#8B7355',TU:'#8B7355',
  CT:'#4B7A9A',FO:'#4B7A9A',CH:'#4B7A9A',MI:'#4B7A9A',SE:'#4B7A9A',
  CB:'#7A5B9A',NQ:'#7A5B9A',RN:'#7A5B9A',SC:'#7A5B9A',TF:'#7A5B9A',
  LP:'#5A7A5A',LR:'#5A7A5A',MZ:'#5A7A5A',SJ:'#5A7A5A',SL:'#5A7A5A',
};
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio',
               'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

function fmtMes(m) {
  if (!m) return '';
  const [y,mo] = m.split('-');
  return `${MESES[parseInt(mo)-1]} ${y}`;
}
function fmtC(n) {
  if (!n || n === 0) return '—';
  if (n >= 1e9) return '$' + (n/1e9).toFixed(2).replace('.',',') + ' mil M';
  if (n >= 1e6) return '$' + Math.round(n/1e6) + 'M';
  if (n >= 1e3) return '$' + Math.round(n/1e3) + 'K';
  return '$' + Math.round(n);
}
function fmtFull(n) {
  if (!n || n === 0) return '—';
  return '$ ' + Math.round(n).toLocaleString('es-AR');
}
function fmtUSD(n) {
  if (!n || n === 0) return '—';
  if (n >= 1e6) return 'U$S ' + (n/1e6).toFixed(1).replace('.',',') + 'M';
  if (n >= 1e3) return 'U$S ' + Math.round(n/1e3) + 'K';
  return 'U$S ' + Math.round(n).toLocaleString('es-AR');
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function normalizarLinea(l) {
  if (!l) return l;
  const u = l.trim().toUpperCase();
  if (u === 'PRE' || u === 'EXPORTACION' || u === 'EXPORTACIÓN' ||
      u === 'PRE - EXPORTACION' || u === 'LINEA PRE') return 'Exportación';
  return l;
}

function normalizarAvalista(g) {
  if (!g) return g;
  const u = g.trim().toUpperCase();
  if (u.includes('FOGAER') && (u.includes('SAPEM') || u.includes('S.A.P.E'))) return 'FOGAER';
  if (u === 'FO.GA.BA' || u === 'F.O.GA.BA' || u === 'FO.GA.B.A') return 'FOGABA';
  if (u.includes('CUYO AVAL') && (u.includes('FAE') || u.includes('MENDOZA'))) return 'CUYO AVAL';
  if (u.includes('CASFOG') && (u.includes('SERIE II') || u.includes(' II '))) return 'CASFOG SERIE II';
  if (u.includes('CASFOG') && (u.includes('SERIE IV') || u.includes(' IV '))) return 'CASFOG SERIE IV';
  // Unified casing
  return g.trim().toUpperCase();
}

function resolveProvince(prov, provMap) {
  if (!prov) return { code: '?', name: 'Sin datos', color: '#888' };
  const upper = prov.trim().toUpperCase();
  // Known 2-letter code
  if (provMap[upper]) return { code: upper, name: provMap[upper], color: PROV_COLORS[upper] || '#888' };
  // Full name → find its code
  const entry = Object.entries(provMap).find(([k,v]) => v.toLowerCase() === prov.trim().toLowerCase());
  if (entry) return { code: entry[0], name: entry[1], color: PROV_COLORS[entry[0]] || '#888' };
  // Unknown
  return { code: upper.slice(0,2), name: prov.trim(), color: '#888' };
}

function buildDonut(items, totalMonto) {
  const cx=60, cy=60, r=44;
  const C = 2 * Math.PI * r;
  let ang = 0;
  const circles = items.map((item, i) => {
    const m = (item.monto_ars||0) + (item.monto_usd||0);
    if (!m || !totalMonto) return '';
    const frac = m / totalMonto;
    const dash = frac * C;
    const color = DONUT_COLORS[i % DONUT_COLORS.length];
    const seg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none"
      stroke="${color}" stroke-width="18"
      stroke-dasharray="${dash.toFixed(2)} ${(C - dash + 0.5).toFixed(2)}"
      transform="rotate(${-90 + ang}, ${cx}, ${cy})"/>`;
    ang += frac * 360;
    return seg;
  }).join('');
  return `<svg width="120" height="120" viewBox="0 0 120 120">
    ${circles}
    <text x="60" y="56" text-anchor="middle" font-family="-apple-system,sans-serif"
      font-size="11" font-weight="700" fill="#15140F">${fmtC(totalMonto)}</text>
    <text x="60" y="68" text-anchor="middle" font-family="-apple-system,sans-serif"
      font-size="7" fill="#bbb" letter-spacing="1">TOTAL</text>
  </svg>`;
}

const MESES_ABBR = ['Ene','Feb','Mar','Abr','May','Jun',
                    'Jul','Ago','Sep','Oct','Nov','Dic'];

function buildAnual(anual, currentMes) {
  const year = currentMes.slice(0, 4);
  // Serie completa Ene→Dic, 0 en meses sin datos
  const byMes = {};
  (anual.por_mes || []).forEach(m => { byMes[m.mes] = m.total || 0; });
  const serie = MESES_ABBR.map((_, i) => {
    const key = `${year}-${String(i+1).padStart(2,'0')}`;
    return { i, val: byMes[key] || 0, current: key === currentMes };
  });
  const maxVal = Math.max(1, ...serie.map(s => s.val));

  // Geometría
  const W = 652, H = 148, padTop = 24, padBot = 22;
  const plotH = H - padTop - padBot;
  const slotW = W / 12;
  const barW  = slotW * 0.46;
  const baseY = padTop + plotH;

  const bars = serie.map(s => {
    const cx    = slotW * s.i + slotW / 2;
    const x     = cx - barW / 2;
    const barH  = s.val > 0 ? Math.max(2, (s.val / maxVal) * plotH) : 0;
    const y     = baseY - barH;
    const color = s.current ? '#D4A830' : '#2E5A2E';
    const labelColor = s.current ? '#15140F' : '#999';
    const valTxt = s.val > 0
      ? `<text x="${cx.toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle"
           font-family="-apple-system,sans-serif" font-size="8.5"
           font-weight="${s.current?'700':'600'}" fill="${s.current?'#15140F':'#666'}">${s.val}</text>`
      : '';
    return `
      ${barH>0 ? `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="1.5" fill="${color}"/>` : ''}
      ${valTxt}
      <text x="${cx.toFixed(1)}" y="${(baseY+13).toFixed(1)}" text-anchor="middle"
        font-family="-apple-system,sans-serif" font-size="8"
        font-weight="${s.current?'700':'500'}" fill="${labelColor}"
        letter-spacing="0.02em">${MESES_ABBR[s.i]}</text>`;
  }).join('');

  return `<svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    <line x1="0" y1="${baseY}" x2="${W}" y2="${baseY}" stroke="#e5e0d6" stroke-width="1"/>
    ${bars}
  </svg>`;
}

function mesActualLocal() {
  // Hora local, NO toISOString(): en UTC-3 el último día del mes salta al siguiente.
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

async function mesesConDatos() {
  try {
    const res = await fetch('/api/carga/meses');
    const data = await res.json();
    return Array.isArray(data) ? data.filter(m => m && m.mes) : [];
  } catch (e) {
    return [];
  }
}

function pintarSelectorMeses(meses, mesActivo) {
  const sel = document.getElementById('sel-mes');
  if (!sel) return;
  // El mes activo siempre figura, aunque todavía no tenga expedientes cargados.
  const opciones = meses.slice();
  if (!opciones.some(m => m.mes === mesActivo)) {
    opciones.push({ mes: mesActivo, total: 0 });
    opciones.sort((a, b) => b.mes.localeCompare(a.mes));
  }
  sel.innerHTML = opciones.map(m =>
    `<option value="${m.mes}"${m.mes === mesActivo ? ' selected' : ''}>` +
    `${fmtMes(m.mes)}${m.total ? ` (${m.total})` : ''}</option>`
  ).join('');
  sel.onchange = () => cargarInforme(sel.value);
}

async function cargarInforme(mes) {
  const page = document.getElementById('page');
  page.innerHTML = `<p style="text-align:center;padding:40px;color:#aaa">Cargando ${fmtMes(mes)}…</p>`;
  // La URL acompaña al mes elegido: recargar o compartir el link mantiene el informe.
  history.replaceState(null, '', `?mes=${mes}`);

  const year = mes.slice(0, 4);
  const [smRes, stRes, provRes, anRes] = await Promise.all([
    fetch(`/api/carga/stats_mensuales?mes=${mes}`),
    fetch(`/api/carga/stats?mes=${mes}`),
    fetch('/api/config/provincias'),
    fetch(`/api/carga/anual?year=${year}`),
  ]);
  const sm      = await smRes.json();
  const stats   = await stRes.json();
  const provMap = await provRes.json();
  const anual   = await anRes.json();

  if (sm.error) {
    page.innerHTML = `<p style="color:red;padding:40px">Error: ${sm.error}</p>`;
    return;
  }
  render(mes, sm, stats, provMap, anual);
}

async function init() {
  const pedido = new URLSearchParams(location.search).get('mes');
  const meses  = await mesesConDatos();
  // Sin ?mes= explícito, arranca en el último mes CON datos (el mes en curso puede
  // estar vacío los primeros días) y recién ahí cae al mes calendario.
  const mes = pedido || (meses.length ? meses[0].mes : mesActualLocal());

  pintarSelectorMeses(meses, mes);
  await cargarInforme(mes);
}

function render(mes, sm, stats, provMap, anual) {
  const r = sm.resumen;
  const total      = r.total_ars + r.total_usd;
  const promedio   = r.total_ars > 0 ? r.monto_ars / r.total_ars : 0;
  const provsActivas = sm.por_provincia.filter(p => p.total_ars + p.total_usd > 0).length;
  const now = new Date().toLocaleDateString('es-AR', {day:'2-digit',month:'2-digit',year:'numeric'});

  // ── Evolución anual ───────────────────────────────────────────────────────
  const anualOk   = anual && !anual.error && (anual.total_anual || 0) > 0;
  const anualChart = anualOk ? buildAnual(anual, mes) : '';

  // ── Province grid ─────────────────────────────────────────────────────────
  const maxProv = Math.max(1, ...sm.por_provincia.map(p => p.total_ars + p.total_usd));
  const provHTML = sm.por_provincia.map(p => {
    const n    = p.total_ars + p.total_usd;
    const { name, color } = resolveProvince(p.provincia, provMap);
    const barW  = Math.round(100 * n / maxProv);
    const fill  = (p.total_usd > 0 && p.total_ars === 0) ? '#2e7d32' : '#2a2a1e';
    const amt   = (p.total_usd > 0 && p.total_ars === 0) ? fmtUSD(p.monto_usd) : fmtC(p.monto_ars);
    return `<div class="prov-row">
      <span class="prov-dot" style="background:${color}"></span>
      <span class="prov-name" title="${esc(name)}">${esc(name)}</span>
      <div class="prov-bg" style="min-width:50px"><div class="prov-fill" style="width:${barW}%;background:${fill}"></div></div>
      <span class="prov-n">${n}</span>
      <span class="prov-amt">${amt}</span>
    </div>`;
  }).join('');

  // ── Lines section ─────────────────────────────────────────────────────────
  const normalizedLines = sm.por_linea.map(l => ({...l, linea: normalizarLinea(l.linea)}));
  const totalLineMonto  = normalizedLines.reduce((s,l) => s + (l.monto_ars||0) + (l.monto_usd||0), 0);
  const donut = buildDonut(normalizedLines, totalLineMonto);
  const legendHTML = normalizedLines.slice(0,8).map((l, i) => {
    const m = (l.monto_ars||0) + (l.monto_usd||0);
    const p = totalLineMonto ? Math.round(100*m/totalLineMonto) : 0;
    if (!p) return '';
    return `<div class="leg-row">
      <span class="leg-sq" style="background:${DONUT_COLORS[i%DONUT_COLORS.length]}"></span>
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:108px" title="${esc(l.linea)}">${esc(l.linea)}</span>
      <span class="leg-pct">${p}%</span>
    </div>`;
  }).join('');
  const lineRows = normalizedLines.map(l => {
    const m = (l.monto_ars||0) + (l.monto_usd||0);
    const n = l.total_ars + l.total_usd;
    const p = totalLineMonto ? Math.round(100*m/totalLineMonto) : 0;
    const isUSD = l.total_usd > 0 && l.total_ars === 0;
    return `<tr${isUSD ? ' class="usd"' : ''}>
      <td>${esc(l.linea)}</td>
      <td>${n}</td>
      <td>${isUSD ? fmtUSD(l.monto_usd) : fmtC(l.monto_ars)}</td>
      <td>${p}%</td>
    </tr>`;
  }).join('');

  // ── Avalista / Fondo grid ─────────────────────────────────────────────────
  const totalAva = sm.por_garantia.reduce((s,g) => s + g.total_ars + g.total_usd, 0);
  const avalHTML = sm.por_garantia.map(g => {
    const n    = g.total_ars + g.total_usd;
    const m    = (g.monto_ars||0) + (g.monto_usd||0);
    const p    = totalAva ? Math.round(100*n/totalAva) : 0;
    const name = normalizarAvalista(g.garantia);
    return `<div class="ava-cell">
      <span class="ava-name">${esc(name)}</span>
      <span class="ava-n">${n}</span>
      <span class="ava-m">${fmtC(m)}</span>
      <span class="ava-p">${p}%</span>
    </div>`;
  }).join('');

  // ── Region grid ───────────────────────────────────────────────────────────
  const regionHTML = sm.por_region.map(reg => {
    const n = reg.total_ars + reg.total_usd;
    return `<div class="region-cell">
      <div class="reg-name">${esc(reg.region)}</div>
      <div class="reg-n">${n}</div>
      <div class="reg-amt">${fmtC(reg.monto_ars)}</div>
      ${reg.total_usd > 0 ? `<div class="reg-usd">${fmtUSD(reg.monto_usd)}</div>` : ''}
    </div>`;
  }).join('');

  // ── Render ────────────────────────────────────────────────────────────────
  document.getElementById('page').innerHTML = `
    <div class="rpt-header">
      <div>
        <div class="rpt-kicker"><span class="rpt-dot"></span>TABLERO DE CARGA CFI &middot; INFORME MENSUAL</div>
        <div class="rpt-title">Informe Solicitudes &mdash; ${fmtMes(mes)}</div>
      </div>
      <div class="rpt-right">
        <div class="rpt-tagline">Solicitudes ingresadas</div>
        <div class="rpt-period">${fmtMes(mes)}</div>
        <div class="rpt-meta">Generado el ${now}<br>Reporte interno</div>
      </div>
    </div>

    <div class="stats-bar">
      <div class="sc">
        <div class="sc-lbl">Total solicitudes</div>
        <div class="sc-val wh">${total}</div>
        <div class="sc-sub">${r.total_ars} en pesos &middot; ${r.total_usd} en dólares</div>
      </div>
      <div class="sc">
        <div class="sc-lbl">Monto total ARS</div>
        <div class="sc-val">${fmtC(r.monto_ars)}</div>
        <div class="sc-sub">${fmtFull(r.monto_ars)}</div>
      </div>
      <div class="sc">
        <div class="sc-lbl">Promedio por solicitud</div>
        <div class="sc-val">${fmtC(promedio)}</div>
        <div class="sc-sub">Solicitudes en pesos</div>
      </div>
      <div class="sc">
        <div class="sc-lbl">Provincias alcanzadas</div>
        <div class="sc-val wh">${provsActivas}<span style="font-size:14px;color:rgba(255,255,255,0.3);font-weight:400"> /24</span></div>
        <div class="sc-sub">${24 - provsActivas} sin solicitudes registradas</div>
      </div>
    </div>

    ${r.total_usd > 0 ? `<div class="usd-note">
      <span>Línea 2002 (dólares):</span>
      <span class="usd-note-val">${fmtUSD(r.monto_usd)}</span>
      <span>en ${r.total_usd} solicitud${r.total_usd > 1 ? 'es' : ''} &mdash; no incluidas en montos ARS.</span>
    </div>` : '<div style="margin-bottom:28px"></div>'}

    ${anualOk ? `
    <div class="sh"><span class="sh-t">Evolución del A&ntilde;o</span><span class="sh-s">00 &mdash; Solicitudes ingresadas por mes &middot; ${mes.slice(0,4)}</span></div>
    <div class="anual-chart">${anualChart}</div>` : ''}

    ${sm.por_provincia.length ? `
    <div class="sh"><span class="sh-t">Distribución por Provincia</span><span class="sh-s">01 &mdash; Cantidad y monto solicitado</span></div>
    <div class="prov-grid">${provHTML}</div>` : ''}

    ${normalizedLines.length ? `
    <div class="sh"><span class="sh-t">Líneas de Financiamiento</span><span class="sh-s">02 &mdash; Participación sobre monto</span></div>
    <div class="lines-layout">
      <div class="donut-col">
        ${donut}
        <div class="legend">${legendHTML}</div>
      </div>
      <table class="lines-tbl">
        <thead><tr><th>Línea</th><th>Cant.</th><th>Monto</th><th>%</th></tr></thead>
        <tbody>${lineRows}</tbody>
        <tfoot><tr>
          <td>Total</td><td>${total}</td>
          <td>${fmtC(r.monto_ars)}${r.total_usd > 0 ? ' + ' + fmtUSD(r.monto_usd) : ''}</td>
          <td>100%</td>
        </tr></tfoot>
      </table>
    </div>` : ''}

    ${sm.por_garantia.length ? `
    <div class="sh"><span class="sh-t">Distribución por Avalista / Fondo</span><span class="sh-s">03 &mdash; ${totalAva} operaciones registradas</span></div>
    <div class="ava-grid">${avalHTML}</div>` : ''}

    ${sm.por_region.length ? `
    <div class="sh"><span class="sh-t">Distribución por Región</span><span class="sh-s">04 &mdash; Centro / NOA / NEA+SDE / Patagonia / Cuyo+LP</span></div>
    <div class="region-grid">${regionHTML}</div>` : ''}

    <div class="rpt-footer">
      <span>Tablero de Carga &middot; CFI</span>
      <span>P&aacute;g. 01 / 01</span>
      <span>Generado el ${now}</span>
    </div>`;
}

init();
</script>
</body>
</html>
